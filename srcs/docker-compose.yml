services:
  mariadb:
    build: ./requirements/mariadb/
    image: mariadb:ince
    container_name: mariadb
    restart: always
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
    env_file:
      - .env
  wordpress:
    build: ./requirements/wordpress/
    image: wordpress:ince
    container_name: wordpress
    restart: always
    depends_on:
      - mariadb
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    env_file:
      - .env

  nginx:
    build: ./requirements/nginx/
    image: nginx:ince
    container_name: nginx
    restart: always
    depends_on:
      - wordpress
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    ports:
      - 443:443




volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/sechlahb/data/mariadb
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/sechlahb/data/wordpress

networks:
  inception: